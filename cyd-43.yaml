# cyd-43.yaml
esphome:
  name: power-monitor
  friendly_name: CYD 4.3 Inch Power Monitor

  on_boot:
    priority: -100
    then:
      # Hand the LVGL widgets to the C++ views before anything draws
      - script.execute: bind_ui
      # Start the dim -> full dim -> light sleep schedule without needing a touch first
      - script.execute: reset_dim_timer
  
  includes:
    # External components copy only their top-level sources. Copy the nested
    # headers separately, preserving model/, ble/, and ui/ under src/.
    - components/power_monitor/model
    - components/power_monitor/ble
    - components/power_monitor/ui

external_components:
  - source:
      type: local
      path: components

ota:
  - platform: esphome

logger:
  level: DEBUG
  hardware_uart: UART0

# Light sleep drops WiFi and the API connection for long stretches.
# Disable the 15 min "no client / no WiFi" watchdog reboots, which wipe the RAM history.
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

wifi:
  reboot_timeout: 0s
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # use_address: 10.223.223.163

time:
  - platform: homeassistant
    id: ha_time

# Root-level custom component declaration
power_monitor:

packages:
  # Core Platform
  hardware: !include core/hardware.yaml
  backlight: !include core/backlight.yaml
  power: !include core/power.yaml

  # Sensors & Data Ingestion
  power_ble: !include sensors/power-ble.yaml

  # UI Subsystem
  fonts: !include ui/fonts.yaml
  styles_containers: !include ui/styles/containers.yaml
  styles_controls: !include ui/styles/controls.yaml
  styles_typography: !include ui/styles/typography.yaml
  ui_state: !include ui/state.yaml
  ui_navigation: !include ui/scripts/navigation.yaml
  ui_refresh: !include ui/scripts/refresh.yaml
  ui_settings: !include ui/scripts/settings.yaml
  ui_bindings: !include ui/bindings.yaml
  lvgl_root: !include ui/lvgl.yaml
