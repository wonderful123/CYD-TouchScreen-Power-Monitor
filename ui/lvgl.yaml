# ui/lvgl.yaml
lvgl:
  buffer_size: 25%

  displays:
    - my_display

  touchscreens:
    - my_touchscreen

  bg_color: 0x05080B

  # Persistent chrome layered above all active pages
  top_layer:
    widgets:
      # Header Title
      - label:
          id: hdr_title
          text: "PWR·MON"
          x: 12
          y: 6
          width: 84
          height: 14
          styles: style_t_title

      # Header Status Area
      - label:
          id: hdr_status
          text: ""
          x: 268
          y: 6
          width: 200
          height: 14
          text_align: RIGHT
          styles: style_t_status

      # Header Divider Line
      - obj:
          id: hdr_rule
          x: 0
          y: 22
          width: 480
          height: 1
          styles: style_rule

      # Tab Bar Background Container
      - obj:
          x: 0
          y: 246
          width: 480
          height: 34
          styles: style_nav
          scrollable: false

      # Bottom Divider Line
      - obj:
          x: 0
          y: 246
          width: 480
          height: 1
          styles: style_rule

      # Navigation Tab 0: OVERVIEW
      - button:
          x: 0
          y: 247
          width: 120
          height: 33
          styles: style_clear
          widgets:
            - label:
                id: tab0_lbl
                text: "OVERVIEW"
                align: CENTER
                y: -2
                styles: style_t_tab
                text_color: 0xD3E6EB
          on_click:
            then:
              - script.execute:
                  id: goto_page
                  idx: 0

      # Navigation Tab 1: SCOPE
      - button:
          x: 120
          y: 247
          width: 120
          height: 33
          styles: style_clear
          widgets:
            - label:
                id: tab1_lbl
                text: "SCOPE"
                align: CENTER
                y: -2
                styles: style_t_tab
          on_click:
            then:
              - script.execute:
                  id: goto_page
                  idx: 1

      # Navigation Tab 2: STATS
      - button:
          x: 240
          y: 247
          width: 120
          height: 33
          styles: style_clear
          widgets:
            - label:
                id: tab2_lbl
                text: "STATS"
                align: CENTER
                y: -2
                styles: style_t_tab
          on_click:
            then:
              - script.execute:
                  id: goto_page
                  idx: 2

      # Navigation Tab 3: SETTINGS
      - button:
          x: 360
          y: 247
          width: 120
          height: 33
          styles: style_clear
          widgets:
            - label:
                id: tab3_lbl
                text: "SETTINGS"
                align: CENTER
                y: -2
                styles: style_t_tab
          on_click:
            then:
              - script.execute:
                  id: goto_page
                  idx: 3

      # Tab Active Underlines
      - obj: {id: tab0_ul, x: 32, y: 272, width: 56, height: 1, styles: style_underline}
      - obj: {id: tab1_ul, x: 152, y: 272, width: 56, height: 1, styles: style_underline, hidden: true}
      - obj: {id: tab2_ul, x: 272, y: 272, width: 56, height: 1, styles: style_underline, hidden: true}
      - obj: {id: tab3_ul, x: 392, y: 272, width: 56, height: 1, styles: style_underline, hidden: true}

  # UI Page Definitions
  pages:
    - !include pages/main.yaml
    - !include pages/scope.yaml
    - !include pages/stats.yaml
    - !include pages/settings.yaml