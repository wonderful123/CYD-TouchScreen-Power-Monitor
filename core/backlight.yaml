# core/backlight.yaml
output:
  - platform: ledc
    pin: GPIO2
    frequency: 1220
    id: gpio_backlight_pwm
    # A level of 0 stops the PWM and holds the pin low (no faint glow or glitch
    # pulse), which also keeps "off" off across light sleep.
    zero_means_zero: true

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON

script:
  # Write the active level straight to the PWM output (the same path the dim/fade/off
  # code uses), so it works from any state and doesn't depend on the light's own state
  # or its default transition.
  - id: restore_backlight
    then:
      - lambda: |-
          float active = 0.0f;
          id(display_backlight).remote_values.as_brightness(&active);
          id(gpio_backlight_pwm).set_level(id(display_backlight).gamma_correct_lut(active));

  # Smooth backlight fade between two linear levels (0..1)
  - id: fade_backlight
    parameters:
      from_level: float
      to_level: float
    then:
      - repeat:
          count: 6
          then:
            - output.set_level:
                id: gpio_backlight_pwm
                level: !lambda |-
                  const float t = static_cast<float>(iteration + 1) / 6.0f;
                  return id(display_backlight).gamma_correct_lut(
                    from_level + (to_level - from_level) * t
                  );
            - delay: 60ms
